<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle Financeiro</title>
  <meta name="description" content="Controle financeiro pessoal — fluxo de caixa, dívidas e investimentos.">

  <!-- PWA -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">

  <!-- iOS: instalar como app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Financeiro">
  <link rel="apple-touch-icon" href="FinApp/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="FinApp/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="FinApp/apple-touch-icon-167.png">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="FinApp/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="FinApp/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="FinApp/favicon-16.png">
  <link rel="shortcut icon" href="FinApp/favicon.ico">

  <style>
    :root {
      --bg: #f6f7fb;
      --accent: #4f46e5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }
    body {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    #app-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Tela de carregamento exibida até o iframe responder */
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bg);
      z-index: 10;
      transition: opacity 0.25s ease;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    #loading-screen.hide {
      opacity: 0;
      pointer-events: none;
    }
    #loading-screen img {
      width: 64px;
      height: 64px;
      border-radius: 16px;
    }
    #loading-screen .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid #e1e5f0;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
    }
    #loading-screen p {
      color: #6b7290;
      font-size: 13px;
      margin: 0;
    }
    @keyframes girar {
      to { transform: rotate(360deg); }
    }

    /* Aviso caso a URL não tenha sido configurada, ou caso o iframe
       demore demais (sinal de que pode estar sendo bloqueado) */
    #config-warning {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 11;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
      text-align: center;
    }
    #config-warning.show { display: flex; }
    #config-warning .box {
      max-width: 420px;
      background: #fff;
      border: 1px solid #e1e5f0;
      border-radius: 12px;
      padding: 24px;
    }
    #config-warning code {
      display: block;
      background: #eef0f7;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 12px;
      word-break: break-all;
    }
    #config-warning a.btn-abrir {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <img src="FinApp/icon-192.png" alt="Controle Financeiro">
    <div class="spinner"></div>
    <p>Carregando seu controle financeiro…</p>
  </div>

  <div id="config-warning">
    <div class="box">
      <strong id="warning-titulo">Configure a URL do seu Web App</strong>
      <p id="warning-texto">Abra este <code>index.html</code> e troque o valor de
      <code>APP_URL</code> pela URL do seu Apps Script publicado (termina em
      <code>/exec</code>).</p>
      <code id="url-atual"></code>
      <div id="warning-acao"></div>
    </div>
  </div>

  <iframe
    id="app-frame"
    title="Controle Financeiro"
    allow="clipboard-write"
  ></iframe>

  <script>
    // =========================================================
    // TROQUE AQUI pela URL do SEU Web App do Apps Script, se precisar.
    // Como pegar: no editor do Apps Script > Implantar >
    // Nova implantação > tipo "App da Web" > Executar como: você >
    // Quem tem acesso: (sua escolha) > Implantar > copie a URL
    // (ela termina em /exec).
    //
    // Requisito no Codigo.gs: o doGet() precisa terminar com
    // .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)
    // para o Google permitir que esta página seja embutida aqui.
    // =========================================================
    const APP_URL = "https://script.google.com/macros/s/AKfycbzOJZhLQVwTmrsK3lkFZG7fZWGM75ffwUwQWL_pceFb6ygQNRMQLPZQLD-_bgMpRvTq/exec";

    const frame = document.getElementById("app-frame");
    const loading = document.getElementById("loading-screen");
    const warning = document.getElementById("config-warning");

    function mostrarAvisoBloqueio() {
      document.getElementById("warning-titulo").innerText = "Não consegui abrir dentro do app";
      document.getElementById("warning-texto").innerHTML =
        "O Google pode estar bloqueando a incorporação (login pendente, ou o " +
        "<code>Codigo.gs</code> ainda sem <code>setXFrameOptionsMode(ALLOWALL)</code>). " +
        "Você pode abrir direto no navegador:";
      document.getElementById("url-atual").innerText = APP_URL;
      document.getElementById("warning-acao").innerHTML =
        '<a class="btn-abrir" href="' + APP_URL + '" target="_top">Abrir direto</a>';
      warning.classList.add("show");
      loading.classList.add("hide");
    }

    if (!APP_URL || APP_URL.indexOf("SEU_ID_AQUI") !== -1) {
      document.getElementById("url-atual").innerText = APP_URL;
      warning.classList.add("show");
      loading.classList.add("hide");
    } else {
      let carregou = false;
      frame.src = APP_URL;
      frame.addEventListener("load", () => {
        carregou = true;
        loading.classList.add("hide");
      });
      // Se depois de um tempo o iframe não avisou que carregou, mostra o
      // aviso com um link para abrir direto (evita tela de loading eterna).
      setTimeout(() => {
        if (!carregou) mostrarAvisoBloqueio();
      }, 9000);
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }
  </script>

</body>
</html>
