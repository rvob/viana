<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Wallpapers RV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: palco de prévia fixo à esquerda, painel de controles à direita; empilha no celular. */
:root{
  --bg:#0e1013; --surface:#15181c; --surface-2:#1c2025; --line:#2a2f36;
  --fg:#eceff1; --muted:#8d96a0; --accent:#3fb6b2; --accent-ink:#06201f;
  --display:'Sora','Segoe UI',system-ui,sans-serif;
  --body:'Manrope','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eceff1; --surface:#ffffff; --surface-2:#f2f4f5; --line:#d6dce0;
    --fg:#14181c; --muted:#59636c; --accent:#0b7f7c; --accent-ink:#ffffff; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eceff1; --surface:#ffffff; --surface-2:#f2f4f5; --line:#d6dce0;
  --fg:#14181c; --muted:#59636c; --accent:#0b7f7c; --accent-ink:#ffffff; color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 56px;
}
.wrap{max-width:1240px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font:600 22px/1.2 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:981px){.stage{position:sticky;top:max(16px,env(safe-area-inset-top,0px))}}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);font:600 12.5px var(--body);padding:8px 8px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:not([aria-pressed="true"]):hover{color:var(--fg)}
.view{display:flex;justify-content:center;padding:6px 0}
.frame{--ar:1.7778;--maxh:62vh;position:relative;width:min(100%,calc(var(--maxh) * var(--ar)));aspect-ratio:var(--ar);line-height:0;border-radius:6px;overflow:hidden;box-shadow:0 10px 36px rgba(0,0,0,.35)}
@media (max-width:980px){.frame{--maxh:52vh}}
#cv{display:block;width:100%;height:100%}
.guide{position:absolute;inset:0;pointer-events:none;border-radius:6px;background:radial-gradient(circle closest-side,transparent 98.4%,rgba(0,0,0,.58) 99.2%);box-shadow:none}
.guide::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px dashed rgba(255,255,255,.75)}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px}
.meta .mono{font-family:var(--mono);font-size:12px;color:var(--fg)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.btn{width:100%;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 14.5px var(--body);padding:13px 16px;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.6;cursor:default}
.status{min-height:18px;font-size:12.5px;color:var(--muted);text-align:center}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
h2{font:600 11.5px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 12px}
h3{font:600 12px var(--body);margin:14px 0 8px;color:var(--muted);letter-spacing:.02em}
h3:first-of-type{margin-top:0}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.sw{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px;cursor:pointer;text-align:left;color:var(--fg);font:500 11px/1.25 var(--body);display:flex;flex-direction:column;gap:6px;min-width:0}
.sw:hover{border-color:var(--muted)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sw .chip{position:relative;height:38px;border-radius:6px;border:1px solid rgba(128,128,128,.25)}
.sw .dot{position:absolute;right:5px;bottom:5px;width:9px;height:9px;border-radius:50%;border:1px solid rgba(128,128,128,.55)}
.sw span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label.f{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin:14px 0 6px}
label.f b{font:500 12px var(--mono);color:var(--fg)}
.hexrow{display:flex;gap:6px;align-items:center}
.hexrow input[type=color]{flex:0 0 40px;width:40px;height:36px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
.hex{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);font:500 13px var(--mono);text-transform:uppercase;padding:0 10px}
.copy{flex:0 0 auto;height:36px;min-width:36px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--muted);cursor:pointer;font:600 11.5px var(--body)}
.copy:hover{color:var(--fg);border-color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.posgrid{display:grid;grid-template-columns:repeat(3,44px);gap:6px}
.posgrid button{width:44px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer;display:grid;place-items:center;padding:0}
.posgrid button i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.posgrid button[aria-pressed="true"]{border-color:var(--accent)}
.posgrid button[aria-pressed="true"] i{background:var(--accent)}
.swap{width:100%;height:34px;margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);font:600 12.5px var(--body);cursor:pointer}
.swap:hover{border-color:var(--accent);color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);margin:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gerador de wallpapers RV</h1>
    <p>Escolha o fundo, ajuste a logo e baixe o PNG no tamanho exato.</p>
  </header>

  <div class="layout">
    <section class="stage" aria-label="Prévia">
      <div class="seg" id="fmtSeg" role="group" aria-label="Formato">
        <button type="button" data-v="wall" aria-pressed="true">Wallpaper PC 4K</button>
        <button type="button" data-v="profile" aria-pressed="false">Foto de perfil</button>
      </div>
      <div class="view">
        <div class="frame" id="frame">
          <canvas id="cv" width="3840" height="2160" role="img" aria-label="Prévia do wallpaper"></canvas>
          <div class="guide" id="guide" hidden></div>
        </div>
      </div>
      <div class="meta">
        <span class="mono" id="dims">3840 × 2160 px</span>
        <label class="check" id="guideWrap" hidden><input type="checkbox" id="guideChk" checked> Mostrar corte circular</label>
      </div>
      <button type="button" class="btn" id="dl">Baixar PNG</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>

    <div class="panel">
      <section class="group">
        <h2>Fundo</h2>
        <h3>Cores sólidas</h3>
        <div class="swatches" id="swSolid"></div>
        <h3>Degradês</h3>
        <div class="swatches" id="swGrad"></div>

        <h3 style="margin-top:18px">Ajuste fino</h3>
        <div class="seg" id="typeSeg" role="group" aria-label="Tipo de fundo">
          <button type="button" data-v="solid">Sólido</button>
          <button type="button" data-v="gradient">Linear</button>
          <button type="button" data-v="radial">Radial</button>
        </div>
        <label class="f" for="c1_t">Cor 1</label>
        <div class="hexrow"><input type="color" id="c1_c" aria-label="Escolher cor 1"><input type="text" id="c1_t" class="hex" maxlength="7" spellcheck="false"><button type="button" class="copy" data-for="c1_t">Copiar</button></div>
        <div id="c2Wrap">
          <button type="button" class="swap" id="swapBtn">⇅ Inverter cores</button>
          <label class="f" for="c2_t">Cor 2</label>
          <div class="hexrow"><input type="color" id="c2_c" aria-label="Escolher cor 2"><input type="text" id="c2_t" class="hex" maxlength="7" spellcheck="false"><button type="button" class="copy" data-for="c2_t">Copiar</button></div>
        </div>
        <div id="angleWrap">
          <label class="f" for="angle">Ângulo <b id="angleV">135°</b></label>
          <input type="range" id="angle" min="0" max="360" step="5">
        </div>
      </section>

      <section class="group">
        <h2>Textura</h2>
        <div class="seg" id="texSeg" role="group" aria-label="Textura">
          <button type="button" data-v="none">Nenhuma</button>
          <button type="button" data-v="grain">Grão</button>
          <button type="button" data-v="lines">Linhas</button>
          <button type="button" data-v="dots">Pontos</button>
        </div>
        <div id="texAmt">
          <label class="f" for="tex">Intensidade <b id="texV">35%</b></label>
          <input type="range" id="tex" min="5" max="100">
        </div>
      </section>

      <section class="group">
        <h2>Logo</h2>
        <label class="f" for="logo_t" style="margin-top:0">Cor da logo</label>
        <div class="hexrow"><input type="color" id="logo_c" aria-label="Escolher cor da logo"><input type="text" id="logo_t" class="hex" maxlength="7" spellcheck="false"><button type="button" class="copy" data-for="logo_t">Copiar</button></div>
        <label class="f" for="opacity">Opacidade <b id="opacityV">100%</b></label>
        <input type="range" id="opacity" min="10" max="100">
        <label class="f" for="scale">Tamanho <b id="scaleV">26%</b></label>
        <input type="range" id="scale" min="10" max="60">
        <h3 style="margin-top:16px">Sombra</h3>
        <div class="seg" id="shSeg" role="group" aria-label="Sombra da logo">
          <button type="button" data-v="none">Nenhuma</button>
          <button type="button" data-v="soft">Suave</button>
          <button type="button" data-v="deep">Profunda</button>
          <button type="button" data-v="glow">Brilho</button>
        </div>
        <div id="posWrap">
          <h3 style="margin-top:16px">Posição</h3>
          <div class="posgrid" id="posGrid"></div>
        </div>
        <p class="note" id="posNote" hidden style="margin-top:14px">Na foto de perfil a logo fica sempre centralizada.</p>
      </section>
    </div>
  </div>
</div>

  {name:'Névoa lavanda',   type:'solid',    c1:'#EBEEF5', logo:'#414143'},
  {name:'Areia fria',      type:'solid',    c1:'#D8D5CE', logo:'#2B2B2E'},
  {name:'Oceano',          type:'gradient', c1:'#0f2027', c2:'#2c5364', angle:135, logo:'#ffffff'},
  {name:'Ardósia',         type:'gradient', c1:'#1f2023', c2:'#3d3f43', angle:135, logo:'#ffffff'},
  {name:'Orin grafite',    type:'gradient', c1:'#1E1E1E', c2:'#555555', angle:145, logo:'#F4F4F4'},
  {name:'Abismo teal',     type:'gradient', c1:'#0D262B', c2:'#07545C', angle:140, logo:'#EBEEF5'},
  {name:'Pântano',         type:'gradient', c1:'#274645', c2:'#07545C', angle:135, logo:'#EBEEF5'},
  {name:'Aurora boreal',   type:'gradient', c1:'#0B1220', c2:'#1F6F6B', angle:155, logo:'#E6F4F2'},
  {name:'Noturno azul',    type:'gradient', c1:'#0F1C2D', c2:'#193867', angle:135, logo:'#E9E9E9'},
  {name:'Azul profundo',   type:'radial',   c1:'#12151E', c2:'#1D2B46', logo:'#E9E9E9'},
  {name:'Crepúsculo',      type:'gradient', c1:'#1A1F3A', c2:'#4A3F6B', angle:145, logo:'#F0EEF7'},
  {name:'Brasa',           type:'gradient', c1:'#1E1112', c2:'#5A2A2E', angle:150, logo:'#F6ECEA'},
  {name:'Meia-noite cobre',type:'gradient', c1:'#10131C', c2:'#6B4A3A', angle:135, logo:'#F5EDE7'},
  {name:'Floresta noturna',type:'gradient', c1:'#0F1A14', c2:'#2F5541', angle:140, logo:'#EAF3EC'}
];

const SHADOWS = {
  soft: {blur:.05, y:.02, color:'rgba(0,0,0,.40)'},
  deep: {blur:.10, y:.05, color:'rgba(0,0,0,.65)'},
  glow: {blur:.09, y:0,   color:null}
};

const DEFAULTS = {
  fmt:'wall', pal:17, bgType:'gradient', c1:'#0B1220', c2:'#1F6F6B', angle:155,
  logoColor:'#E6F4F2', opacity:100, scaleWall:26, scaleProfile:62, pos:4,
  shadow:'none', texture:'none', tex:35, guide:true
};
let state = Object.assign({}, DEFAULTS);
try{
  const saved = JSON.parse(localStorage.getItem('rv-wallpapers-v2') || 'null');
  if(saved && typeof saved === 'object') state = Object.assign(state, saved);
}catch(e){}
function persist(){ try{ localStorage.setItem('rv-wallpapers-v2', JSON.stringify(state)); }catch(e){} }

/* ---------- helpers ---------- */
const HEX6 = /^#[0-9a-f]{6}$/i;
function normHex(v){
  v = String(v).trim().replace(/^#?/, '#');
  if(/^#[0-9a-f]{3}$/i.test(v)) v = '#' + v.slice(1).split('').map(c => c + c).join('');
  return HEX6.test(v) ? v.toUpperCase() : null;
}
function rgb(hex){ return [1,3,5].map(i => parseInt(hex.slice(i, i+2), 16)); }
function lum(hex){
  const [r,g,b] = rgb(hex).map(v => { v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); });
  return .2126*r + .7152*g + .0722*b;
}
function cssBg(type, c1, c2, angle){
  if(type === 'solid') return c1;
  if(type === 'radial') return `radial-gradient(circle at 50% 50%, ${c1}, ${c2})`;
  return `linear-gradient(${angle}deg, ${c1}, ${c2})`;
}

/* ---------- logo ---------- */
const logoImg = new Image();
let logoReady = false;
logoImg.onload = () => { logoReady = true; schedule(); };
logoImg.src = 'data:image/png;base64,' + LOGO_B64;
let tintCache = {key:'', canvas:null};
function tinted(lw, lh, color){
  const key = lw + 'x' + lh + color;
  if(tintCache.key === key) return tintCache.canvas;
  const c = document.createElement('canvas'); c.width = lw; c.height = lh;
  const t = c.getContext('2d');
  t.drawImage(logoImg, 0, 0, lw, lh);
  t.globalCompositeOperation = 'source-in';
  t.fillStyle = color; t.fillRect(0, 0, lw, lh);
  tintCache = {key, canvas:c};
  return c;
}

/* ---------- painting ---------- */
function paintBg(ctx, w, h){
  let fill;
  if(state.bgType === 'solid'){
    fill = state.c1;
  }else if(state.bgType === 'radial'){
    fill = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.hypot(w, h)/2);
    fill.addColorStop(0, state.c1); fill.addColorStop(1, state.c2);
  }else{
    const a = state.angle * Math.PI / 180;
    const dx = Math.sin(a), dy = -Math.cos(a);
    const L = Math.abs(w*dx) + Math.abs(h*dy);
    fill = ctx.createLinearGradient(w/2 - dx*L/2, h/2 - dy*L/2, w/2 + dx*L/2, h/2 + dy*L/2);
    fill.addColorStop(0, state.c1); fill.addColorStop(1, state.c2);
  }
  ctx.fillStyle = fill;
  ctx.fillRect(0, 0, w, h);
}

/* O bloco da textura é sempre múltiplo exato do espaçamento, e nenhum ponto
   tem o centro na borda do bloco, então a repetição não deixa emendas. */
const tileCache = new Map();
function textureTile(type, k, intensity, overlay){
  const key = [type, k, intensity.toFixed(2), overlay].join('|');
  if(tileCache.has(key)) return tileCache.get(key);
  let tile;
  if(type === 'grain'){
    const base = 256, size = base * k;
    const small = document.createElement('canvas'); small.width = small.height = base;
    const sctx = small.getContext('2d');
    const img = sctx.createImageData(base, base), d = img.data;
    for(let i = 0; i < d.length; i += 4){
      const light = Math.random() > .5 ? 255 : 0;
      d[i] = d[i+1] = d[i+2] = light;
      d[i+3] = ((Math.random() + Math.random()) / 2) * intensity * 255 * .5;
    }
    sctx.putImageData(img, 0, 0);
    tile = document.createElement('canvas'); tile.width = tile.height = size;
    const t = tile.getContext('2d');
    t.imageSmoothingEnabled = false;
    t.drawImage(small, 0, 0, size, size);
  }else if(type === 'lines'){
    const sp = 12 * k, size = sp * 14;
    tile = document.createElement('canvas'); tile.width = tile.height = size;
    const t = tile.getContext('2d');
    t.strokeStyle = overlay === 'light' ? `rgba(255,255,255,${Math.min(intensity*.5,1)})` : `rgba(0,0,0,${Math.min(intensity*.5,1)})`;
    t.lineWidth = 1.4 * k;
    t.beginPath();
    for(let i = -size; i < size * 2; i += sp){ t.moveTo(i, 0); t.lineTo(i + size, size); }
    t.stroke();
  }else{
    const sp = 18 * k, size = sp * 10, q = sp / 4;
    tile = document.createElement('canvas'); tile.width = tile.height = size;
    const t = tile.getContext('2d');
    t.fillStyle = overlay === 'light' ? `rgba(255,255,255,${Math.min(intensity*.7,1)})` : `rgba(0,0,0,${Math.min(intensity*.7,1)})`;
    for(let row = 0; row < 10; row++){
      const y = q + row * sp, off = (row % 2) * (sp / 2);
      for(let col = 0; col < 10; col++){
        t.beginPath(); t.arc(q + col * sp + off, y, 1.6 * k, 0, Math.PI * 2); t.fill();
      }
    }
  }
  tileCache.set(key, tile);
  return tile;
}
function paintTexture(ctx, w, h, k){
  if(state.texture === 'none') return;
  const avg = state.bgType === 'solid' ? lum(state.c1) : (lum(state.c1) + lum(state.c2)) / 2;
  const tile = textureTile(state.texture, k, state.tex / 100, avg > .5 ? 'dark' : 'light');
  ctx.fillStyle = ctx.createPattern(tile, 'repeat');
  ctx.fillRect(0, 0, w, h);
}

function paintLogo(ctx, w, h){
  if(!logoReady) return;
  const ratio = logoImg.naturalHeight / logoImg.naturalWidth;
  const scale = (state.fmt === 'wall' ? state.scaleWall : state.scaleProfile) / 100;
  const lw = Math.round(w * scale), lh = Math.round(lw * ratio);
  const pos = state.fmt === 'profile' ? 4 : state.pos;
  const col = pos % 3, row = Math.floor(pos / 3), m = Math.min(w, h) * .06;
  let x = col === 0 ? m : col === 1 ? (w - lw) / 2 : w - lw - m;
  let y = row === 0 ? m : row === 1 ? (h - lh) / 2 : h - lh - m;
  if(pos === 4){ x += lw * .0183; y += lh * .0546; } /* centro óptico: o R pesa mais que o V */
  const img = tinted(lw, lh, state.logoColor);
  ctx.save();
  ctx.globalAlpha = state.opacity / 100;
  const sh = SHADOWS[state.shadow];
  if(sh){
    ctx.shadowColor = sh.color || state.logoColor;
    ctx.shadowBlur = lw * sh.blur;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = lw * sh.y;
  }
  ctx.drawImage(img, Math.round(x), Math.round(y));
  ctx.restore();
}

const cv = $('cv'), ctx = cv.getContext('2d');
function render(){
  const f = FORMATS[state.fmt];
  if(cv.width !== f.w || cv.height !== f.h){ cv.width = f.w; cv.height = f.h; }
  paintBg(ctx, f.w, f.h);
  paintTexture(ctx, f.w, f.h, f.k);
  paintLogo(ctx, f.w, f.h);
}
let queued = false;
function schedule(){
  if(queued) return; queued = true;
  requestAnimationFrame(() => { queued = false; render(); });
}

/* ---------- UI ---------- */
function setSeg(id, value){
  document.querySelectorAll('#' + id + ' button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === value)));
}
function buildSwatches(){
  PALETTES.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw'; b.dataset.i = i;
    b.title = p.type === 'solid' ? p.c1 : p.c1 + ' → ' + p.c2;
    b.innerHTML = '<div class="chip"><i class="dot"></i></div><span class="n"></span>';
    b.querySelector('.chip').style.background = cssBg(p.type, p.c1, p.c2, p.angle || 135);
    b.querySelector('.dot').style.background = p.logo;
    b.querySelector('.n').textContent = p.name;
    (p.type === 'solid' ? $('swSolid') : $('swGrad')).appendChild(b);
  });
}
function buildPos(){
  for(let i = 0; i < 9; i++){
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.i = i; b.setAttribute('aria-label', 'Posição ' + (i + 1));
    b.innerHTML = '<i></i>';
    $('posGrid').appendChild(b);
  }
}
function sync(){
  const wall = state.fmt === 'wall', f = FORMATS[state.fmt];
  setSeg('fmtSeg', state.fmt); setSeg('typeSeg', state.bgType);
  setSeg('texSeg', state.texture); setSeg('shSeg', state.shadow);
  document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === state.pal)));
  document.querySelectorAll('#posGrid button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === state.pos)));
  [['c1','c1'],['c2','c2'],['logo','logoColor']].forEach(([id, key]) => {
    $(id + '_c').value = state[key].toLowerCase();
    if(document.activeElement !== $(id + '_t')) $(id + '_t').value = state[key].toUpperCase();
  });
  $('c2Wrap').hidden = state.bgType === 'solid';
  $('angleWrap').hidden = state.bgType !== 'gradient';
  $('angle').value = state.angle; $('angleV').textContent = state.angle + '°';
  $('texAmt').hidden = state.texture === 'none';
  $('tex').value = state.tex; $('texV').textContent = state.tex + '%';
  $('opacity').value = state.opacity; $('opacityV').textContent = state.opacity + '%';
  const sc = $('scale');
  sc.min = wall ? 10 : 20; sc.max = wall ? 60 : 90;
  sc.value = wall ? state.scaleWall : state.scaleProfile;
  $('scaleV').textContent = sc.value + '%';
  $('posWrap').hidden = !wall; $('posNote').hidden = wall;
  $('frame').style.setProperty('--ar', (f.w / f.h).toFixed(4));
  $('dims').textContent = f.w + ' × ' + f.h + ' px';
  $('guideWrap').hidden = wall; $('guideChk').checked = state.guide;
  $('guide').hidden = wall || !state.guide;
  $('dl').textContent = wall ? 'Baixar wallpaper 4K (PNG)' : 'Baixar foto de perfil 1024 (PNG)';
}
function changed(){ sync(); schedule(); persist(); }
function customBg(){ state.pal = -1; }

function bind(){
  $('fmtSeg').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; state.fmt = b.dataset.v; $('status').textContent = ''; changed(); });
  $('typeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; state.bgType = b.dataset.v; customBg(); changed(); });
  $('texSeg').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; state.texture = b.dataset.v; changed(); });
  $('shSeg').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; state.shadow = b.dataset.v; changed(); });
  $('posGrid').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; state.pos = +b.dataset.i; changed(); });
  document.querySelector('.panel').addEventListener('click', e => {
    const b = e.target.closest('.sw'); if(!b) return;
    const p = PALETTES[+b.dataset.i];
    Object.assign(state, {pal:+b.dataset.i, bgType:p.type, c1:p.c1.toUpperCase(), c2:(p.c2 || p.c1).toUpperCase(), angle:p.angle || 135, logoColor:p.logo.toUpperCase()});
    changed();
  });
  [['c1','c1',true],['c2','c2',true],['logo','logoColor',false]].forEach(([id, key, isBg]) => {
    $(id + '_c').addEventListener('input', e => { state[key] = e.target.value.toUpperCase(); if(isBg) customBg(); changed(); });
    $(id + '_t').addEventListener('input', e => { const v = normHex(e.target.value); if(v){ state[key] = v; if(isBg) customBg(); changed(); } });
    $(id + '_t').addEventListener('blur', () => { $(id + '_t').value = state[key]; });
  });
  $('swapBtn').addEventListener('click', () => { const x = state.c1; state.c1 = state.c2; state.c2 = x; customBg(); changed(); });
  $('angle').addEventListener('input', e => { state.angle = +e.target.value; customBg(); changed(); });
  $('tex').addEventListener('input', e => { state.tex = +e.target.value; changed(); });
  $('opacity').addEventListener('input', e => { state.opacity = +e.target.value; changed(); });
  $('scale').addEventListener('input', e => { state[state.fmt === 'wall' ? 'scaleWall' : 'scaleProfile'] = +e.target.value; changed(); });
  $('guideChk').addEventListener('change', e => { state.guide = e.target.checked; changed(); });

  document.querySelectorAll('.copy').forEach(btn => btn.addEventListener('click', async () => {
    const input = $(btn.dataset.for), text = input.value.toUpperCase();
    let ok = false;
    try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){
      input.focus(); input.select();
      try{ ok = document.execCommand('copy'); }catch(e2){}
    }
    const old = 'Copiar';
    btn.textContent = ok ? 'Copiado' : 'Selecionado';
    setTimeout(() => { btn.textContent = old; }, 1400);
  }));

  $('dl').addEventListener('click', download);
}

async function download(){
  const btn = $('dl'), st = $('status'), f = FORMATS[state.fmt];
  btn.disabled = true; st.textContent = 'Gerando PNG…';
  try{
    render();
    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    if(!blob) throw new Error('canvas');
    let cap = null;
    try{ cap = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){}
    if(cap){
      await cap.save({filename:f.file, data:blob});
    }else{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = f.file;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
    st.textContent = f.file + ' pronto (' + f.w + ' × ' + f.h + ').';
  }catch(err){
    st.textContent = 'Não foi possível salvar o arquivo. Tente de novo.';
  }finally{
    btn.disabled = false;
  }
}

buildSwatches(); buildPos(); bind(); sync(); render();
})();
</script>
