<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="background-color" content="#111111">
  <meta name="description" content="Livro de Capturas - COTW">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Livro de Capturas">
  <link rel="icon" href="/cotw/icons/favicon-32.png?v=4" sizes="32x32" type="image/png">
  <link rel="icon" href="/cotw/icons/icon-192.png?v=4" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/cotw/icons/apple-touch-icon-180.png?v=4">
  <link rel="manifest" href="/cotw/manifest.json?v=4">
  <title>Livro de Capturas - COTW</title>
  <style>
    :root {
      color-scheme: dark;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #111;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      padding-top: var(--safe-top);
      padding-right: var(--safe-right);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      background: #111;
    }
    #cotw-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #111;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      transition: opacity .25s ease, visibility .25s ease;
    }
    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loading-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #444;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #retry {
      display: none;
      margin-top: 4px;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 8px 14px;
      color: #fff;
      background: #1f1f1f;
      cursor: pointer;
      font: inherit;
    }
    #retry.show { display: inline-block; }
    #ios-landing {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
    }
    #ios-landing .icone {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      display: block;
    }
    #ios-landing p {
      max-width: 300px;
      margin: 0;
      line-height: 1.45;
    }
    #ios-landing .msg { color: #cfcfcf; font-size: 14px; }
    #ios-landing .dica { color: #9a9a9a; font-size: 12.5px; margin-top: 4px; }
    #ios-abrir {
      margin-top: 4px;
      border: 0;
      border-radius: 10px;
      padding: 13px 26px;
      color: #fff;
      background: #2f7a5e;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    #install {
      position: fixed;
      right: calc(16px + var(--safe-right));
      bottom: calc(16px + var(--safe-bottom));
      z-index: 20;
      display: none;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      background: #1f1f1f;
      box-shadow: 0 5px 22px rgba(0,0,0,.45);
      cursor: pointer;
      font-weight: 600;
    }
    #install.show { display: block; }
  </style>
</head>
<body>
  <main id="app">
    <iframe
      id="cotw-frame"
      title="Livro de Capturas - COTW"
      allow="fullscreen; clipboard-read; clipboard-write"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>

  <div id="loading">
    <div class="loading-box">
      <div class="spinner" id="spinner"></div>
      <strong>Livro de Capturas - COTW</strong>
      <span id="loading-msg">Carregando...</span>
      <button id="retry" type="button">Tentar de novo</button>
    </div>
  </div>

  <div id="ios-landing" hidden>
    <div class="loading-box">
      <img class="icone" src="/cotw/icons/icon-512.png?v=4" alt="">
      <strong>Livro de Capturas - COTW</strong>
      <p class="msg">No iPhone o app abre no próprio Safari — o login do Google não funciona dentro do modo instalado com moldura.</p>
      <button id="ios-abrir" type="button">Abrir o app</button>
      <p class="dica">Dica: toque em <strong>Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong> pra criar um atalho com o ícone certinho.</p>
    </div>
  </div>

  <button id="install" type="button">Instalar aplicativo</button>

  <script>
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxBXGk62nJMEK5_Lnw7ty57giwflD0USGVwITnrbF7mMpKTb9IW-xli0-VUmhpNgr-MFg/exec';

    var isIOS = /iP(hone|od|ad)/.test(navigator.platform) ||
      (navigator.userAgent.includes('Macintosh') && 'ontouchend' in document);

    // navigator.standalone só existe no Safari/iOS: true quando o app foi
    // aberto pelo ícone da Tela de Início (já "instalado"), false quando é
    // uma aba comum do Safari.
    var isStandalone = window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;

    if (isIOS && isStandalone) {
      // Já instalado e aberto pelo atalho: o ícone já foi capturado há muito
      // tempo, então pode ir direto pro app (o iframe não funcionaria aqui
      // por causa do bloqueio de cookie de terceiros do WebKit).
      window.location.replace(EXEC_URL);
    } else if (isIOS) {
      // Aba comum do Safari (ainda não instalado, ou só navegando). Aqui a
      // página PRECISA continuar sendo esta — com nosso ícone e manifest —
      // porque é o que o "Adicionar à Tela de Início" vai capturar. Por isso
      // não redireciona sozinho: mostra um botão, e deixa a pessoa instalar
      // o atalho com o ícone certo antes (ou depois) de usar o app.
      mostrarTelaIOS();
    } else {
      iniciarShell();
    }

    function mostrarTelaIOS() {
      document.getElementById('ios-landing').hidden = false;
      document.getElementById('ios-abrir').addEventListener('click', () => {
        window.location.href = EXEC_URL;
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(console.warn);
        });
      }
    }

    function iniciarShell() {
      const frame = document.getElementById('cotw-frame');
      const loading = document.getElementById('loading');
      const spinner = document.getElementById('spinner');
      const loadingMsg = document.getElementById('loading-msg');
      const retryBtn = document.getElementById('retry');
      const installButton = document.getElementById('install');

      let carregou = false;
      let timeoutId;

      function esconderCarregando() {
        carregou = true;
        clearTimeout(timeoutId);
        setTimeout(() => loading.classList.add('hidden'), 250);
      }

      function recarregar() {
        carregou = false;
        loading.classList.remove('hidden');
        spinner.style.display = '';
        loadingMsg.textContent = 'Carregando...';
        retryBtn.classList.remove('show');
        frame.src = EXEC_URL; // força recarregar o iframe
        armarTimeout();
      }

      function armarTimeout() {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
          if (carregou) return;
          spinner.style.display = 'none';
          loadingMsg.textContent = 'Está demorando mais que o normal. Toque na tela ou tente de novo.';
          retryBtn.classList.add('show');
        }, 12000);
      }

      frame.src = EXEC_URL;
      armarTimeout();

      frame.addEventListener('load', esconderCarregando);

      // Às vezes o iframe já terminou de carregar mas o evento "load" não chega
      // a disparar a tempo (comum em WebViews mobile). Se a pessoa tocar na tela
      // de carregamento, assume que ela já está vendo o app por trás e libera a
      // tela na hora, em vez de segurar até o timeout de 12s.
      loading.addEventListener('click', () => {
        if (!retryBtn.classList.contains('show')) esconderCarregando();
      });

      // Quando o app volta de segundo plano (ex.: trocou de app e voltou) via
      // cache do navegador (bfcache), o evento "load" do iframe não dispara de
      // novo — sem isso, uma tela de carregamento antiga podia ficar por cima.
      window.addEventListener('pageshow', (event) => {
        if (event.persisted) esconderCarregando();
      });

      retryBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        recarregar();
      });

      // Service Worker: somente o shell do GitHub Pages (este index, manifest e
      // ícones). O conteúdo do Google Apps Script continua sendo carregado
      // normalmente no iframe, sem passar pelo cache do SW.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(console.warn);
        });
      }

      let deferredPrompt = null;

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;
        installButton.classList.add('show');
      });

      installButton.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installButton.classList.remove('show');
      });

      window.addEventListener('appinstalled', () => {
        installButton.classList.remove('show');
        deferredPrompt = null;
      });
    }
  </script>
</body>
</html>
