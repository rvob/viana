*{box-sizing:border-box;margin:0;padding:0}
html{background:#0a0b14}
body{min-height:100vh;padding:22px 14px 20px;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff;background:#0a0b14;background:radial-gradient(circle at 10% 0,rgba(96,56,200,.40) 0,rgba(96,56,200,0) 45%),radial-gradient(circle at 100% 100%,rgba(16,110,200,.28) 0,rgba(16,110,200,0) 48%),#0a0b14;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}

header{margin-bottom:20px;text-align:center}

.sub{margin-top:4px;font-size:14px;color:#9da3b0}

/* Grade em flexbox (funciona em Android antigo) */
.grid{display:flex;flex-wrap:wrap;justify-content:center;margin:0 -8px}
.cell{width:100%;padding:8px}
.btn{display:flex;align-items:center;min-height:76px;padding:12px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:#161933;color:#fff;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ico{display:flex;align-items:center;justify-content:center;width:46px;height:46px;flex:none;border-radius:12px;background:rgba(0,0,0,.25)}
.txt{min-width:0;margin-left:14px;overflow:hidden}
.txt strong{display:block;font-size:16px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt small{display:block;margin-top:2px;font-size:12px;color:#9da3b0}
.txt small.pago{display:inline-block;margin-top:4px;padding:1px 9px;border-radius:20px;border:1px solid rgba(143,164,255,.4);background:rgba(143,164,255,.14);font-size:11px;font-weight:600;color:#c3ceff}

/* Cores (cor sólida primeiro, degradê depois) */
/* Cartões neutros: a cor da marca fica só no ícone */
.c-cplayer .ico{background:#e53935;border-color:rgba(255,255,255,.2)}
.c-fast .ico{background:#ee5a0a;background:linear-gradient(135deg,#ffb000,#ee5a0a);border-color:rgba(255,255,255,.25)}
.c-quick .ico{background:#ff8a00;background:linear-gradient(135deg,#ffa01a,#f57c00);border-color:rgba(255,255,255,.25)}
.c-unitv .ico{background:#cc1a1a;background:linear-gradient(135deg,#e39a2d,#cc1a1a 42%,#6b4a9c 72%,#3a5aa5);border-color:rgba(255,255,255,.3)}
.c-xc .ico{background:#fff;border-color:rgba(255,255,255,.6)}
.c-xc .ico svg{stroke:#0f6fc6}
.c-dream .ico{background:#a23ed0;background:linear-gradient(135deg,#e1279d,#7b3fe4 55%,#22b9df);border-color:rgba(255,255,255,.25)}
.c-smart .ico{background:#e52d27;border-color:rgba(255,255,255,.25)}

/* Foco para controle remoto / teclado */
a.btn:focus,.mb:focus{outline:3px solid #fff;outline-offset:2px}
a.btn:focus{border-color:#8fa4ff}
a.btn:hover{background:#1e2247}
a.btn:active{opacity:.8}

footer{margin-top:30px;padding-top:18px;border-top:1px solid rgba(255,255,255,.07);text-align:center;font-size:12px;color:#737985}
footer a{font-weight:500;color:#8fa4ff;text-decoration:none}

/* Janela de download */
.ov{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:9;padding:14px;overflow-y:auto;background:#06070d;background:rgba(5,6,12,.95)}
.ov.show{display:flex}
.md{width:100%;max-width:440px;margin:auto;padding:24px 18px 18px;text-align:center;border-radius:18px;border:1px solid rgba(255,255,255,.15);background:#13152a}
.circ{display:flex;align-items:center;justify-content:center;width:92px;height:92px;margin:0 auto 14px;border-radius:50%;border:3px solid #8fa4ff;font-size:44px;font-weight:700}
.circ.done{background:#5a52e0}
.md h2{margin-bottom:4px;font-size:20px;font-weight:600;line-height:1.3;word-wrap:break-word}
.st{min-height:21px;font-size:14px;color:#9da3b0}
.bar{height:6px;margin:14px 0 16px;border-radius:6px;background:#2b2f45;overflow:hidden}
.bar i{display:block;width:0;height:100%;background:#8fa4ff}
.act{display:flex;flex-wrap:wrap;margin:0 -4px}
.mb{display:block;flex:1 1 130px;min-height:48px;margin:4px;padding:13px 12px;font-family:inherit;font-size:14px;font-weight:600;line-height:1.2;color:#fff;text-align:center;text-decoration:none;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:#2a2e47;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mb.pri{border-color:#8fa4ff;background:#4b44c9}
.tip{margin-top:12px;padding:10px 12px;border-left:3px solid #8fa4ff;background:#181b30;font-size:12.5px;line-height:1.5;text-align:left;color:#d3d8e0}
.url{max-height:4.6em;margin-top:10px;padding:8px 10px;border:1px dashed rgba(255,255,255,.2);overflow:hidden;font-size:11px;text-align:left;color:#a9b0bd;word-break:break-all}

@media (min-width:601px){.cell{width:50%}}
@media (min-width:1000px){.cell{width:33.3333%}h1{font-size:32px}}

.st{font-size:17px}
.mb{min-height:60px;font-size:18px}
.tip{font-size:15px}
.url{font-size:13px}
}
</style>

    tv: 'Na TV Box: quando terminar, abra o arquivo baixado (pelo Downloader ou gerenciador de arquivos) e, se pedir, permita instalar de fontes desconhecidas.',
    smarttv: 'Atenção: TVs Samsung e LG não instalam arquivos APK. Esses apps são para TV Box, Android TV ou Fire TV.',
    android: 'No celular: quando terminar, toque na notificação do download para instalar. Se pedir, permita instalar de fontes desconhecidas.',
    ios: 'Esses apps são para Android e não instalam no iPhone/iPad.',
    desktop: 'No computador: esses apps são para Android. Baixe e passe o arquivo para sua TV Box ou celular Android.'
  };
  var dev = device();

  /* ----- Barra de progresso (uma única transição CSS) ----- */
  function barRun() {
    bar.style.transition = 'none';
    bar.style.width = '0';
    void bar.offsetWidth;
    bar.style.transition = 'width ' + COUNT + 's linear';
    bar.style.width = '100%';
  }
  function barFull() {
    bar.style.transition = 'none';
    bar.style.width = '100%';
  }

  function stop() { if (timer) { clearInterval(timer); timer = null; } }

  function show(n) {
    circ.textContent = n;
    st.textContent = 'Seu download começa em ' + n + '…';
  }

  function started() {
    stop();
    circ.className = 'circ done';
    circ.innerHTML = CHECK;
    st.textContent = 'Download iniciado! Se nada aconteceu, toque em “Baixar novamente”.';
    barFull();
    now.textContent = 'Baixar novamente';
    cl.textContent = 'Fechar';
  }

  function go() {
    started();
    window.location.href = cur;
  }

  function abrir(a) {
    cur = a.getAttribute('href');
    lastFocus = a;
    openedAt = new Date().getTime();

    ttl.textContent = a.getAttribute('data-name') || 'Aplicativo';
    circ.className = 'circ';
    now.href = cur;
    now.textContent = 'Baixar agora';
    cp.textContent = 'Copiar link';
    cl.textContent = 'Cancelar';
    urlBox.textContent = cur;

    var d = TIPS[dev] || TIPS.desktop;
    if (!/\.apk(\?|#|$)/i.test(cur) && (dev === 'tv' || dev === 'android')) {
      d += ' Se abrir uma página em vez de baixar, siga as instruções que aparecerem.';
    }
    tip.textContent = d;

    ov.className = 'ov show';
    document.body.className = 'lock';

    var n = COUNT;
    show(n);
    barRun();
    stop();
    timer = setInterval(function () {
      n--;
      if (n > 0) { show(n); } else { go(); }
    }, 1000);

    now.focus();
  }

  function fechar() {
    stop();
    clearTimeout(copyT);
    ov.className = 'ov';
    document.body.className = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  /* ----- Copiar link ----- */
  function copyOld(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, text.length); } catch (e) {}
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    document.body.removeChild(ta);
    cp.focus();
    return ok;
  }
  function copyMsg(ok) {
    cp.textContent = ok ? 'Link copiado!' : 'Não foi possível copiar';
    clearTimeout(copyT);
    copyT = setTimeout(function () { cp.textContent = 'Copiar link'; }, 2200);
  }
  function copiar() {
    var u = cur;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(u).then(
        function () { copyMsg(true); },
        function () { copyMsg(copyOld(u)); }
      );
    } else {
      copyMsg(copyOld(u));
    }
  }

  /* ----- Eventos ----- */
  for (var i = 0; i < links.length; i++) {
    links[i].addEventListener('click', function (e) {
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button > 0) return;
      e.preventDefault();
      abrir(this);
    });
  }

  now.addEventListener('click', function (e) {
    // Evita que o "OK" do controle, ainda pressionado ao abrir a janela,
    // dispare o download na hora e pule a contagem.
    if (new Date().getTime() - openedAt < 600) { e.preventDefault(); return; }
    started();
  });
  cp.addEventListener('click', copiar);
  cl.addEventListener('click', fechar);
  ov.addEventListener('click', function (e) { if (e.target === ov) fechar(); });

  window.addEventListener('pageshow', function (e) {
    if (e.persisted && ov.className.indexOf('show') > -1) fechar();
  });

  /* ----- Controle remoto / teclado ----- */
  var DIR = { 37: 'l', 38: 'u', 39: 'r', 40: 'd' };

  function mid(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function move(dir, list) {
    var a = document.activeElement, k;
    if (list.indexOf(a) < 0) { list[0].focus(); return; }
    var c = mid(a), best = null, bs = 1e9;
    for (k = 0; k < list.length; k++) {
      if (list[k] === a) continue;
      var p = mid(list[k]), dx = p.x - c.x, dy = p.y - c.y, main, cross, ok;
      if (dir === 'r') { ok = dx > 5; main = dx; cross = Math.abs(dy); }
      else if (dir === 'l') { ok = dx < -5; main = -dx; cross = Math.abs(dy); }
      else if (dir === 'd') { ok = dy > 5; main = dy; cross = Math.abs(dx); }
      else { ok = dy < -5; main = -dy; cross = Math.abs(dx); }
      if (!ok) continue;
      var s = main + cross * 3;
      if (s < bs) { bs = s; best = list[k]; }
    }
    if (best) {
      best.focus();
      if (best.scrollIntoView && dir !== 'l' && dir !== 'r') {
        var r = best.getBoundingClientRect();
        if (r.top < 0 || r.bottom > (window.innerHeight || 0)) best.scrollIntoView(false);
      }
    }
  }

  document.addEventListener('keydown', function (e) {
    var code = e.keyCode, key = e.key;
    var dir = DIR[code];
    var enter = key === 'Enter' || code === 13 || code === 23 || code === 66;
    var back = key === 'Escape' || key === 'Esc' || key === 'GoBack' || key === 'BrowserBack' ||
               code === 27 || code === 8 || code === 4 || code === 461 || code === 10009;
    var open = ov.className.indexOf('show') > -1;

    if (open) {
      if (back) { e.preventDefault(); fechar(); return; }
      if (key === 'Tab') {
        e.preventDefault();
        var i = mbtns.indexOf(document.activeElement);
        i += e.shiftKey ? -1 : 1;
        if (i < 0) i = mbtns.length - 1;
        if (i >= mbtns.length) i = 0;
        mbtns[i].focus();
        return;
      }
      if (dir && NAV) { e.preventDefault(); move(dir, mbtns); }
      return;
    }

    if (enter && !e.repeat) {
      var idx = links.indexOf(document.activeElement);
      if (idx > -1) { e.preventDefault(); abrir(links[idx]); return; }
    }
    if (dir && NAV) { e.preventDefault(); move(dir, links); }
  });
})();
</script>

</body>
