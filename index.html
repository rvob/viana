<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="language" content="pt-BR">
<meta name="geo.region" content="BR">

<title>Central de Aplicativos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --bg: #08090d;
    --text: #ffffff;
    --muted: #9da3b0;
    --radius: 16px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: 'Poppins', sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 15% 0%, #10312C 0%, #08090d 45%);
    padding: 22px 18px 20px;
    padding: max(22px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
}

/* CABEÇALHO */
header {
    text-align: center;
    margin-bottom: 22px;
}

h1 {
    font-size: 28px;
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 700;
    letter-spacing: -.5px;
}

.subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 4px;
}

.subtitle span {
    color: #22B8A3;
}

/* GRID & BOTÕES */
.buttons-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
}

.button {
    display: flex;
    align-items: center;
    min-height: 80px;
    padding: 14px 18px;
    border-radius: var(--radius);
    color: #fff;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, .1);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
    transition: transform .2s ease, filter .2s ease, box-shadow .2s ease;
    animation: cardIn .4s ease both;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

/* Card Composto para UniTV */
.button-group {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 80px;
    padding: 14px 18px; /* Padronizado com os outros botões */
    border-radius: var(--radius);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, .1);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
    animation: cardIn .4s ease both;
}

.unitv-title {
    display: flex;
    align-items: center;
}

.unitv-title i {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px; /* Padronizado com os outros ícones */
    height: 46px; /* Padronizado com os outros ícones */
    flex-shrink: 0;
    border-radius: 12px;
    background: rgba(0, 0, 0, .2);
    border: 1px solid rgba(255, 255, 255, .1);
    font-size: 18px; /* Padronizado com os outros ícones */
}

.unitv-title strong {
    font-size: 16px;
    font-weight: 600;
    margin-left: 14px; /* Padronizado com o alinhamento de texto dos outros */
}

.unitv-links {
    display: flex;
    gap: 6px;
}

.btn-sublink {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    min-height: 40px;
    background: rgba(0, 0, 0, .25);
    border: 1px solid rgba(255, 255, 255, .15);
    border-radius: 10px;
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    transition: transform .2s ease, background .2s ease;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.btn-sublink:hover {
    background: rgba(255, 255, 255, .2);
    transform: translateY(-2px);
}

.btn-sublink:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px #fff;
}

/* Gradientes dos Botões */
.btn-purple { background: linear-gradient(135deg, #7414a9, #4c0878); }
.btn-blue   { background: linear-gradient(135deg, #0796d5, #045d9a); }
.btn-dark   { background: linear-gradient(135deg, #27303d, #121720); }
.btn-red    { background: linear-gradient(135deg, #f13339, #b30e19); }
.btn-indigo { background: linear-gradient(135deg, #5365dc, #303e9d); }
.btn-orange { background: linear-gradient(135deg, #ff8b19, #dc5900); }
.btn-yellow { background: linear-gradient(135deg, #f5a000, #c87a00); }
.btn-green  { background: linear-gradient(135deg, #10b981, #047857); }

.button:hover {
    transform: translateY(-3px);
    filter: brightness(1.1);
    box-shadow: 0 12px 28px rgba(0, 0, 0, .35);
}

.button:active {
    transform: scale(.98);
}

/* Foco para controle de TV / Teclado */
.button:focus-visible {
    outline: none;
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 0 0 3px #fff, 0 0 0 6px #22B8A3;
}

/* ÍCONE E TEXTO */
.button i {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 12px;
    background: rgba(0, 0, 0, .2);
    border: 1px solid rgba(255, 255, 255, .1);
    font-size: 18px;
}

.btn-text {
    display: flex;
    flex-direction: column;
    margin-left: 14px;
    overflow: hidden;
}

.btn-text strong {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.btn-text small {
    margin-top: 2px;
    color: rgba(255, 255, 255, .75);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* FOOTER */
footer {
    text-align: center;
    margin-top: 34px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, .06);
    color: #737985;
    font-size: 12px;
}

footer a {
    color: #22B8A3;
    text-decoration: none;
    font-weight: 500;
}

footer a:hover {
    color: #E4FAF4;
}

/* ANIMAÇÕES */
@keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ADAPTAÇÕES RESPONSIVAS */
@media(max-width: 600px) {
    body { padding: 20px 12px; }
    .buttons-grid { grid-template-columns: 1fr; gap: 12px; }
    .button, .button-group { min-height: 72px; padding: 12px 14px; }
}

@media(min-width: 601px) and (max-width: 900px) {
    .buttons-grid { grid-template-columns: repeat(2, 1fr); }
}

@media(min-width: 1200px) {
    .buttons-grid { grid-template-columns: repeat(3, 1fr); }
}

/* Telas grandes de TV (assistidas a distância) */
@media(min-width: 1600px) {
    .container { max-width: 1300px; }
    .button, .button-group { min-height: 100px; padding: 18px 24px; }
    .btn-text strong, .unitv-title strong { font-size: 20px; }
    .btn-text small { font-size: 14px; }
    .button i, .unitv-title i { width: 56px; height: 56px; font-size: 22px; }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}

/* ============================================================
   FOCO VISÍVEL TAMBÉM EM NAVEGADORES ANTIGOS (sem :focus-visible)
   ============================================================ */
.button:focus,
.btn-sublink:focus,
.btn-modal:focus {
    outline: none;
    box-shadow: 0 0 0 3px #fff, 0 0 0 6px #22B8A3;
}
.button:focus:not(:focus-visible) { box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
.btn-sublink:focus:not(:focus-visible),
.btn-modal:focus:not(:focus-visible) { box-shadow: none; }

/* ============================================================
   MODAL DE DOWNLOAD (contagem regressiva)
   ============================================================ */
html.modal-open,
html.modal-open body { overflow: hidden; }

.overlay {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(4, 6, 10, .82);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    overflow-y: auto;
    animation: fadeIn .2s ease both;
}
.overlay[hidden] { display: none; }

.modal {
    width: 100%;
    max-width: 460px;
    margin: auto;
    padding: 28px 22px 22px;
    text-align: center;
    border-radius: 20px;
    background: linear-gradient(160deg, #142a27, #0b0e14 60%);
    border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
}

.dl-circle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 96px;
    height: 96px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 3px solid #22B8A3;
    background: rgba(34, 184, 163, .1);
    font-size: 46px;
    font-weight: 700;
    color: #fff;
}
.dl-circle.done { background: #22B8A3; font-size: 40px; }

.modal h2 {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 4px;
    word-break: break-word;
}

.dl-status {
    min-height: 21px;
    color: var(--muted);
    font-size: 14px;
}

.dl-progress {
    height: 6px;
    margin: 16px 0 18px;
    border-radius: 99px;
    background: rgba(255, 255, 255, .1);
    overflow: hidden;
}
.dl-progress span {
    display: block;
    width: 0;
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #22B8A3, #5fe3cf);
}
.dl-progress.run span  { animation: fillBar 3s linear forwards; }
.dl-progress.done span { width: 100%; }

.modal-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 0 -5px;
}

.btn-modal {
    flex: 1 1 140px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    margin: 5px;
    padding: 10px 14px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    text-align: center;
    text-decoration: none;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, .18);
    background: rgba(255, 255, 255, .08);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease, background .15s ease;
}
.btn-modal i { margin-right: 8px; }
.btn-modal:hover { background: rgba(255, 255, 255, .16); }
.btn-modal.primary { background: linear-gradient(135deg, #22B8A3, #0f8172); border-color: transparent; }
.btn-modal.primary:hover { background: linear-gradient(135deg, #2ccfb8, #12967f); }
.btn-modal:focus-visible { transform: scale(1.03); }

.dl-tip {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    border-left: 3px solid #22B8A3;
    background: rgba(34, 184, 163, .08);
    color: #d3d8e0;
    font-size: 12.5px;
    line-height: 1.5;
    text-align: left;
}

.dl-url {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-top: 12px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px dashed rgba(255, 255, 255, .15);
    background: rgba(0, 0, 0, .35);
    color: #a9b0bd;
    font-size: 11px;
    text-align: left;
    word-break: break-all;
}

@keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes fillBar { from { width: 0; } to { width: 100%; } }

@media(max-width: 420px) {
    .modal { padding: 24px 16px 18px; }
    .btn-modal { flex-basis: 100%; }
}

/* TV: modal maior para leitura a distância */
@media(min-width: 1600px) {
    .modal { max-width: 620px; padding: 36px 32px 30px; }
    .dl-circle { width: 120px; height: 120px; font-size: 58px; }
    .modal h2 { font-size: 26px; }
    .dl-status { font-size: 17px; }
    .btn-modal { min-height: 60px; font-size: 18px; }
    .dl-tip { font-size: 15px; }
    .dl-url { font-size: 13px; }
}
</style>
</head>

<!-- Modal de download com contagem regressiva -->
<div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlTitle" aria-describedby="dlStatus">
        <div class="dl-circle" id="dlCircle" aria-hidden="true">3</div>
        <h2 id="dlTitle">Preparando download</h2>
        <p class="dl-status" id="dlStatus" role="status" aria-live="polite">Seu download começa em 3…</p>
        <div class="dl-progress" id="dlProgress" aria-hidden="true"><span></span></div>

        <div class="modal-actions">
            <a class="btn-modal primary" id="dlNow" href="#"><i class="fa-solid fa-download"></i>Baixar agora</a>
            <button type="button" class="btn-modal" id="dlCopy"><i class="fa-regular fa-copy"></i>Copiar link</button>
            <button type="button" class="btn-modal" id="dlClose">Cancelar</button>
        </div>

        <p class="dl-tip" id="dlTip"></p>
        <div class="dl-url" id="dlUrl"></div>
    </div>
</div>

<script>
/* ==============================================================
   CENTRAL DE APLICATIVOS - DOWNLOAD COM CONTAGEM REGRESSIVA

   - Ao clicar/OK em um app, abre um modal na própria página
     (sem nova aba: vários TV Box/WebViews não suportam).
   - Contagem 3-2-1 e o download inicia sozinho.
   - "Baixar agora" é um link normal (<a href>), então funciona
     mesmo se o automático for bloqueado pelo navegador.
   - Código escrito em ES5 para rodar em navegadores antigos.
   =============================================================== */
(function () {
    'use strict';

    var COUNTDOWN = 5; // segundos até iniciar o download

    var overlay  = document.getElementById('overlay');
    var elCircle = document.getElementById('dlCircle');
    var elTitle  = document.getElementById('dlTitle');
    var elStatus = document.getElementById('dlStatus');
    var elProg   = document.getElementById('dlProgress');
    var btnNow   = document.getElementById('dlNow');
    var btnCopy  = document.getElementById('dlCopy');
    var btnClose = document.getElementById('dlClose');
    var elTip    = document.getElementById('dlTip');
    var elUrl    = document.getElementById('dlUrl');

    var modalBtns = [btnNow, btnCopy, btnClose];
    var links = Array.prototype.slice.call(document.querySelectorAll('a.button, a.btn-sublink'));

    var timer = null, copyTimer = null, lastFocus = null, currentUrl = '';

    /* ---------- Detecção de dispositivo (só para a dica de instalação) ---------- */
    function detectDevice() {
        var ua = navigator.userAgent || '';
        var touch = navigator.maxTouchPoints || ('ontouchstart' in window ? 1 : 0);

        if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && touch > 1)) return 'ios';
        if (/Tizen|Web0S|WebOS|NetCast|VIDAA|SMART-?TV|HbbTV/i.test(ua)) return 'smarttv';
        if (/BRAVIA|Android ?TV|GoogleTV|CrKey/i.test(ua) || /AFT[A-Z]/.test(ua)) return 'tv';
        if (/Android/i.test(ua)) return touch ? 'android' : 'tv'; // Android sem toque = TV Box
        return 'desktop';
    }

    var TIPS = {
        tv: 'Na TV Box / Android TV: quando o download terminar, abra o arquivo (pelo Downloader ou gerenciador de arquivos) e, se pedir, permita instalar de fontes desconhecidas.',
        smarttv: 'Atenção: TVs Samsung (Tizen) e LG (webOS) não instalam arquivos APK. Esses apps são para TV Box, Android TV ou Fire TV.',
        android: 'No celular: quando terminar, toque na notificação do download para instalar. Se pedir, permita instalar de fontes desconhecidas.',
        ios: 'Esses apps são para Android e não instalam no iPhone/iPad. Abra esta página em um aparelho Android.',
        desktop: 'No computador: esses apps são para Android e não instalam no Windows/Mac. Baixe e passe o arquivo para sua TV Box ou celular Android (pendrive, Bluetooth ou nuvem).'
    };

    var device = detectDevice();

    function isApk(url) { return /\.apk(\?|#|$)/i.test(url); }

    /* ---------- Utilitários ---------- */
    function closest(el, cls) {
        while (el && el !== document) {
            if (el.classList && el.classList.contains(cls)) return el;
            el = el.parentNode;
        }
        return null;
    }

    function nomeDoLink(a) {
        var strong = a.querySelector('.btn-text strong');
        if (strong) return strong.textContent.replace(/\s+/g, ' ').trim();
        var grupo = closest(a, 'button-group');
        var base = grupo ? grupo.querySelector('.unitv-title strong') : null;
        var nome = base ? base.textContent.trim() : 'Aplicativo';
        return nome + ' — ' + a.textContent.replace(/\s+/g, ' ').trim();
    }

    function setBtn(btn, iconClass, texto) {
        btn.innerHTML = (iconClass ? '<i class="' + iconClass + '"></i>' : '') + texto;
    }

    function stopTimer() {
        if (timer) { clearInterval(timer); timer = null; }
    }

    /* ---------- Contagem regressiva ---------- */
    function renderCount(n) {
        elCircle.textContent = n;
        elStatus.textContent = 'Seu download começa em ' + n + '…';
    }

    function restartBar() {
        elProg.className = 'dl-progress';
        elProg.getElementsByTagName('span')[0].style.animationDuration = COUNTDOWN + 's';
        void elProg.offsetWidth; // força reflow para reiniciar a animação
        elProg.className = 'dl-progress run';
    }

    function marcarIniciado() {
        stopTimer();
        elCircle.className = 'dl-circle done';
        elCircle.innerHTML = '<i class="fa-solid fa-check"></i>';
        elStatus.textContent = 'Download iniciado! Se nada aconteceu, toque em “Baixar novamente”.';
        elProg.className = 'dl-progress done';
        setBtn(btnNow, 'fa-solid fa-download', 'Baixar novamente');
        btnClose.textContent = 'Fechar';
    }

    function iniciarDownload() {
        marcarIniciado();
        // Navegação na própria aba: método mais compatível (TV Box, WebView, PC)
        window.location.href = currentUrl;
    }

    /* ---------- Abrir / fechar modal ---------- */
    function abrirModal(nome, url, origem) {
        currentUrl = url;
        lastFocus = origem || document.activeElement;

        elTitle.textContent = nome;
        elCircle.className = 'dl-circle';
        btnNow.href = url;
        setBtn(btnNow, 'fa-solid fa-download', 'Baixar agora');
        setBtn(btnCopy, 'fa-regular fa-copy', 'Copiar link');
        btnClose.textContent = 'Cancelar';
        elUrl.textContent = url;

        var dica = TIPS[device] || TIPS.desktop;
        if (!isApk(url) && (device === 'tv' || device === 'android')) {
            dica += ' Se abrir uma página em vez de baixar, siga as instruções que aparecerem.';
        }
        elTip.textContent = dica;

        overlay.hidden = false;
        document.documentElement.classList.add('modal-open');

        var n = COUNTDOWN;
        renderCount(n);
        restartBar();
        stopTimer();
        timer = setInterval(function () {
            n--;
            if (n > 0) { renderCount(n); } else { iniciarDownload(); }
        }, 1000);

        btnNow.focus(); // foco no botão principal: no controle remoto basta apertar OK
    }

    function fecharModal() {
        stopTimer();
        clearTimeout(copyTimer);
        overlay.hidden = true;
        document.documentElement.classList.remove('modal-open');
        if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    /* ---------- Copiar link (com fallback para http / TV) ---------- */
    function copiarFallback(texto) {
        var ta = document.createElement('textarea');
        ta.value = texto;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { ta.setSelectionRange(0, texto.length); } catch (e) {}
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        btnCopy.focus();
        return ok;
    }

    function feedbackCopiar(sucesso) {
        setBtn(btnCopy, sucesso ? 'fa-solid fa-check' : 'fa-solid fa-triangle-exclamation',
               sucesso ? 'Link copiado!' : 'Não foi possível copiar');
        clearTimeout(copyTimer);
        copyTimer = setTimeout(function () {
            setBtn(btnCopy, 'fa-regular fa-copy', 'Copiar link');
        }, 2200);
    }

    function copiarLink() {
        var url = currentUrl;
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(url).then(function () {
                feedbackCopiar(true);
            }, function () {
                feedbackCopiar(copiarFallback(url));
            });
        } else {
            feedbackCopiar(copiarFallback(url));
        }
    }

    /* ---------- Eventos ---------- */
    links.forEach(function (link) {
        link.addEventListener('click', function (e) {
            // Ctrl/Cmd/Shift/botão do meio: deixa o navegador agir normalmente
            if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button > 0) return;
            e.preventDefault();
            abrirModal(nomeDoLink(link), link.getAttribute('href'), link);
        });
    });

    // Clique em "Baixar agora": navegação nativa pelo href; só atualiza a tela
    btnNow.addEventListener('click', marcarIniciado);
    btnCopy.addEventListener('click', copiarLink);
    btnClose.addEventListener('click', fecharModal);
    overlay.addEventListener('click', function (e) {
        if (e.target === overlay) fecharModal();
    });

    // Voltando pelo histórico (bfcache), não deixa o modal "preso" aberto
    window.addEventListener('pageshow', function (e) {
        if (e.persisted && !overlay.hidden) fecharModal();
    });

    /* ---------- Navegação por teclado / controle remoto ---------- */
    var DIRS = {
        ArrowRight: 'right', Right: 'right', 39: 'right',
        ArrowLeft: 'left',   Left: 'left',   37: 'left',
        ArrowDown: 'down',   Down: 'down',   40: 'down',
        ArrowUp: 'up',       Up: 'up',       38: 'up'
    };

    function getDir(e) { return DIRS[e.key] || DIRS[e.keyCode] || null; }

    function centro(el) {
        var r = el.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    // Foco espacial: vai para o elemento mais próximo na direção pressionada
    function mover(dir, lista) {
        var atual = document.activeElement;
        if (lista.indexOf(atual) < 0) { lista[0].focus(); return; }

        var c = centro(atual), melhor = null, melhorScore = Infinity;
        lista.forEach(function (el) {
            if (el === atual) return;
            var p = centro(el), dx = p.x - c.x, dy = p.y - c.y, ok, principal, cruzado;
            if (dir === 'right')     { ok = dx > 5;  principal = dx;  cruzado = Math.abs(dy); }
            else if (dir === 'left') { ok = dx < -5; principal = -dx; cruzado = Math.abs(dy); }
            else if (dir === 'down') { ok = dy > 5;  principal = dy;  cruzado = Math.abs(dx); }
            else                     { ok = dy < -5; principal = -dy; cruzado = Math.abs(dx); }
            if (!ok) return;
            var score = principal + cruzado * 3;
            if (score < melhorScore) { melhorScore = score; melhor = el; }
        });
        if (melhor) melhor.focus();
    }

    document.addEventListener('keydown', function (e) {
        var k = e.key, code = e.keyCode;
        var dir = getDir(e);
        var isEnter = k === 'Enter' || code === 13 || code === 23 || code === 66; // 23/66 = OK do controle (DPAD_CENTER)
        var isBack = k === 'Escape' || k === 'Esc' || k === 'Backspace' || k === 'GoBack' || k === 'BrowserBack' ||
                     code === 27 || code === 8 || code === 4 || code === 461 || code === 10009;

        /* Modal aberto */
        if (!overlay.hidden) {
            if (isBack) { e.preventDefault(); fecharModal(); return; }

            if (k === 'Tab') {
                e.preventDefault();
                var i = modalBtns.indexOf(document.activeElement);
                i = e.shiftKey ? i - 1 : i + 1;
                if (i < 0) i = modalBtns.length - 1;
                if (i >= modalBtns.length) i = 0;
                modalBtns[i].focus();
                return;
            }

            if (dir) { e.preventDefault(); mover(dir, modalBtns); return; }

            // Segurar OK não pode acionar o botão em repetição
            if (isEnter && e.repeat) e.preventDefault();
            return;
        }

        /* Lista de apps */
        if (isEnter && !e.repeat) {
            var idx = links.indexOf(document.activeElement);
            if (idx > -1) {
                e.preventDefault();
                abrirModal(nomeDoLink(links[idx]), links[idx].getAttribute('href'), links[idx]);
                return;
            }
        }

        if (dir) {
            e.preventDefault();
            mover(dir, links);
        }
    });
})();
</script>
