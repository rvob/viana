<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel</title>
  <meta name="theme-color" content="#2f6b4f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Painel">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root{
      --verde:#2f6b4f; --verde-esc:#24563f; --verde-claro:#e9f0eb;
      --fundo:#f5f7f6; --card:#ffffff; --borda:#e3e8e5; --texto:#2b2f2d; --sub:#6b7570;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--fundo);color:var(--texto);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    #app{display:flex;flex-direction:column;height:100dvh}

    /* Barra superior */
    header{display:flex;align-items:center;gap:10px;height:52px;padding:0 12px;
      padding-top:env(safe-area-inset-top);background:var(--card);border-bottom:1px solid var(--borda);flex-shrink:0}
    .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;flex:1;min-width:0}
    .logo img{width:28px;height:28px;border-radius:7px}
    .btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--borda);
      background:var(--card);border-radius:9px;cursor:pointer;color:var(--texto)}
    .btn:hover{background:var(--verde-claro);border-color:#cfdcd3}
    .btn:active{transform:scale(.95)}
    .btn svg{width:18px;height:18px}
    .status{width:9px;height:9px;border-radius:50%;background:#c4ccc7;flex-shrink:0}
    .status.on{background:#3aa66b}.status.off{background:#d9534f}

    /* Área do site */
    main{position:relative;flex:1;background:var(--fundo)}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--fundo)}

    /* Splash / carregando */
    #splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:var(--fundo);transition:opacity .35s;z-index:5}
    #splash.hide{opacity:0;pointer-events:none}
    #splash img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 24px rgba(47,107,79,.25)}
    .spin{width:28px;height:28px;border:3px solid var(--verde-claro);border-top-color:var(--verde);border-radius:50%;animation:g 0.8s linear infinite}
    @keyframes g{to{transform:rotate(360deg)}}
    #splash p{color:var(--sub);font-size:14px}

    /* Aviso caso o site bloqueie iframe / sem internet */
    #aviso{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:6;background:var(--fundo)}
    #aviso.show{display:flex}
    .card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:26px 22px;max-width:380px;text-align:center}
    .card h2{font-size:18px;margin-bottom:8px}
    .card p{color:var(--sub);font-size:14px;line-height:1.5;margin-bottom:18px}
    .primario{display:inline-block;background:var(--verde);color:#fff;border:0;border-radius:9px;padding:11px 20px;
      font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;margin:4px}
    .primario:hover{background:var(--verde-esc)}
    .secundario{background:var(--card);color:var(--texto);border:1px solid var(--borda)}
    .secundario:hover{background:var(--verde-claro)}

    /* Botão instalar */
    #instalar{display:none;gap:6px;align-items:center;background:var(--verde);color:#fff;border:0;border-radius:9px;
      height:38px;padding:0 14px;font-weight:600;font-size:13px;cursor:pointer}
    #instalar:hover{background:var(--verde-esc)}
    #instalar.show{display:inline-flex}
    #instalar svg{width:16px;height:16px}
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><img src="icons/icon-192.png" alt=""><span>Painel</span><span class="status" id="status" title="Conexão"></span></div>
    <button id="instalar" title="Instalar app">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Instalar
    </button>
    <button class="btn" id="voltar" title="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button class="btn" id="inicio" title="Início">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </button>
    <button class="btn" id="recarregar" title="Recarregar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <main>
    <div id="splash">
      <img src="icons/icon-192.png" alt="">
      <div class="spin"></div>
      <p>Carregando painel…</p>
    </div>

    <div id="aviso">
      <div class="card">
        <h2 id="avisoTitulo">Não foi possível carregar</h2>
        <p id="avisoTexto">O painel demorou para responder ou não permite ser aberto dentro do app. Você pode tentar de novo ou abrir em tela cheia.</p>
        <button class="primario" id="tentar">Tentar de novo</button>
        <a class="primario secundario" id="abrirDireto" href="#">Abrir em tela cheia</a>
      </div>
    </div>

    <iframe id="site" title="Painel"
      allow="clipboard-read; clipboard-write; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
</div>

<script>
  // ====== CONFIGURAÇÃO ======
  const SITE_URL = "https://dashboard.bz/listas.php";
  const TEMPO_LIMITE = 15000; // ms até mostrar o aviso
  // ==========================

  const frame = document.getElementById("site");
  const splash = document.getElementById("splash");
  const aviso = document.getElementById("aviso");
  const status = document.getElementById("status");
  document.getElementById("abrirDireto").href = SITE_URL;

  let timer;
  function carregar(url){
    aviso.classList.remove("show");
    splash.classList.remove("hide");
    clearTimeout(timer);
    timer = setTimeout(() => {
      splash.classList.add("hide");
      aviso.classList.add("show");
    }, TEMPO_LIMITE);
    frame.src = url;
  }

  frame.addEventListener("load", () => {
    if (!frame.src) return;
    clearTimeout(timer);
    splash.classList.add("hide");
    aviso.classList.remove("show");
  });

  document.getElementById("recarregar").onclick = () => carregar(SITE_URL + (SITE_URL.includes("?") ? "&" : "?") + "_r=" + Date.now());
  document.getElementById("inicio").onclick = () => carregar(SITE_URL);
  document.getElementById("tentar").onclick = () => carregar(SITE_URL);
  document.getElementById("voltar").onclick = () => history.back();

  // Status de conexão
  function atualizaStatus(){
    status.className = "status " + (navigator.onLine ? "on" : "off");
    if (!navigator.onLine){
      document.getElementById("avisoTitulo").textContent = "Sem internet";
      document.getElementById("avisoTexto").textContent = "Verifique sua conexão e toque em Tentar de novo.";
      splash.classList.add("hide"); aviso.classList.add("show");
    }
  }
  addEventListener("online", () => { atualizaStatus(); carregar(SITE_URL); });
  addEventListener("offline", atualizaStatus);

  // Instalação (Chrome / Edge / Android)
  let promptInstalar;
  const btnInstalar = document.getElementById("instalar");
  addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); promptInstalar = e; btnInstalar.classList.add("show");
  });
  btnInstalar.onclick = async () => {
    if (!promptInstalar) return;
    promptInstalar.prompt();
    await promptInstalar.userChoice;
    promptInstalar = null; btnInstalar.classList.remove("show");
  };
  addEventListener("appinstalled", () => btnInstalar.classList.remove("show"));

  // Service worker
  if ("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js", { scope: "./" });
  }

  atualizaStatus();
  if (navigator.onLine) carregar(SITE_URL);
</script>
</body>
</html>
